[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "confirmskip"
version = "0.1.0"
description = "Flag side-effecting agent tool calls that lack a prior user confirmation"
license = {text = "MIT"}
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
confirmskip = "confirmskip.cli:main"

[tool.setuptools.packages.find]
include = ["confirmskip*"]
